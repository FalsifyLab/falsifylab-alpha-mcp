[project]
name = "falsifylab-alpha-mcp"
version = "0.2.0"
description = "MCP data layer for AI-assisted market research: 10 finance tools for AI agents covering DeFi yield, Hyperliquid vaults, SEC Form 4 insider clusters, 8-K material filings, macro tape, US spot ETF flows, airdrop farms, Polymarket whales, confluence_today cross-source signal alignment, and onchain_smart_wallets (live Solana copy-trade bot score data). Free tier requires no signup. Pro $19/mo for real-time."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FalsifyLab", email = "ops@falsifylab.com"}]
license = {text = "MIT"}
keywords = [
  "mcp", "model-context-protocol",
  "ai-agent", "claude", "cursor", "cline", "windsurf",
  "finance", "trading", "quant", "research",
  "crypto", "defi", "yield", "airdrop",
  "sec", "edgar", "form-4", "insider-trading", "8-k",
  "etf", "etf-flows", "polymarket", "prediction-markets",
  "macro", "spx", "vix", "hyperliquid",
  "data-api", "fintech",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://falsifylab.com/pro"
Repository = "https://github.com/FalsifyLab/falsifylab-alpha-mcp"
Issues = "https://github.com/FalsifyLab/falsifylab-alpha-mcp/issues"
Documentation = "https://docs.falsifylab.com/"
"Live demo" = "https://falsifylab.com/demo"

[project.scripts]
falsifylab-alpha-mcp = "falsifylab_alpha_mcp:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["falsifylab_alpha_mcp"]
