name: Bug report
description: Something is broken
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: "Output of `pip show falsifylab-alpha-mcp | grep Version`"
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.8"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Cursor
        - Cline
        - Windsurf
        - Claude Desktop
        - direct stdio
        - hosted (mcp.falsifylab.com)
        - other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command or tool call
      placeholder: "tool_name + arguments OR shell command"
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error or unexpected output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
